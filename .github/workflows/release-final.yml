name: Release Final

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SysDiag.sln

      - name: Build Release
        run: dotnet build SysDiag.sln --configuration Release --no-restore

      - name: Publish app
        run: |
          dotnet publish SysDiag.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:UseAppHost=true -p:PublishTrimmed=false --no-build

      - name: Zip published output
        shell: pwsh
        run: |
          Compress-Archive -Path .\bin\Release\net8.0-windows\win-x64\publish\* -DestinationPath .\sysdiag-1.0.0.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysdiag-release
          path: |
            .\sysdiag-1.0.0.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .\sysdiag-1.0.0.zip
          generate_release_notes: true
