name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Etiqueta de release a publicar'
        required: true
        default: 'v5.7.0'

jobs:
  publish-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore SysDiag.sln

      - name: Publicar el ejecutable autocontenido
        run: dotnet publish SysDiag.csproj -c Release -o publish

      - name: Validar el paquete publicado
        shell: pwsh
        run: |
          .\Tools\validate_release.ps1 -Root .\publish

      - name: Preparar ZIP de entrega
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq 'refs/heads/main') {
            $tag = "${{ github.event.inputs.tag_name }}"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path .\publish\* -DestinationPath "release\SysDiag-$tag.zip" -Force

      - name: Publicar release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/SysDiag-${{ github.ref_name }}.zip
            publish/SysDiag.exe
